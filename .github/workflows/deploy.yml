name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get short SHA
        id: sha
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CDR_SYNC_SERVER_HOST }}
          username: ${{ secrets.CDR_SYNC_SERVER_USER }}
          key: ${{ secrets.CDR_SYNC_SERVER_SSH_KEY }}
          port: ${{ secrets.CDR_SYNC_SERVER_PORT || 22 }}
          script_stop: false
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.CDR_SYNC_SERVER_TARGET_DIR }}"
            DEPLOY_USER="${{ secrets.CDR_SYNC_SERVER_USER }}"
            VERSION="${{ steps.sha.outputs.short_sha }}"

            echo "=========================================="
            echo "🚀 PondCDRSuite Deployment"
            echo "=========================================="
            echo "Version: $VERSION"
            echo "Deploy Path: $DEPLOY_DIR"
            echo "=========================================="

            # Check git
            echo ""
            echo -n "  ✓ Git: "
            if command -v git >/dev/null 2>&1; then
              git --version
            else
              echo "❌ NOT FOUND"
              exit 1
            fi

            # Check deploy directory
            echo -n "  ✓ Deploy directory: "
            if [ -d "$DEPLOY_DIR" ]; then
              echo "EXISTS"
            else
              echo "NOT FOUND — creating..."
              if ! mkdir -p "$DEPLOY_DIR"; then
                echo "ERROR: cannot create $DEPLOY_DIR"
                exit 1
              fi
              echo "  ✓ Deploy directory created: $DEPLOY_DIR"
            fi

            echo ""
            echo "=========================================="
            echo "📦 Git Pull"
            echo "=========================================="

            cd "$DEPLOY_DIR" || exit 1
            git config --global --add safe.directory "$DEPLOY_DIR"

            # ---- Credentials backup ----
            # Task configs (cdr_copy/config/*.env, cdr_sync/config/*.env) hold
            # unique credentials and exist only on the server (git-ignored).
            # They must survive any deploy outcome: success, git failure or abort.
            CRED_BACKUP_DIR="/tmp/pondcdrsuite_config_backup_$$"
            mkdir -p "$CRED_BACKUP_DIR"

            backup_configs() {
              for cfg_dir in cdr_copy/config cdr_sync/config; do
                if [ -d "$cfg_dir" ]; then
                  mkdir -p "$CRED_BACKUP_DIR/$cfg_dir"
                  find "$cfg_dir" -maxdepth 1 -name '*.env' -not -name '*.example' \
                    -exec cp -p {} "$CRED_BACKUP_DIR/$cfg_dir/" \; || true
                fi
              done
            }

            restore_configs() {
              for cfg_dir in cdr_copy/config cdr_sync/config; do
                if [ -d "$CRED_BACKUP_DIR/$cfg_dir" ]; then
                  cp -p "$CRED_BACKUP_DIR/$cfg_dir"/*.env "$cfg_dir/" 2>/dev/null || true
                fi
              done
              rm -rf "$CRED_BACKUP_DIR"
            }

            backup_configs
            if [ -n "$(find "$CRED_BACKUP_DIR" -name '*.env' -print -quit)" ]; then
              echo "  ✓ Credentials backed up to $CRED_BACKUP_DIR"
            else
              echo "  (no credential configs found to back up)"
            fi
            # Restore on ANY exit: success, error or signal
            trap restore_configs EXIT

            # Check if .git exists; if not, clone the repo
            if [ ! -d ".git" ]; then
              echo "  ⚠️  Not a git repository. Cloning from origin..."

              # If directory is not empty, move existing files to a backup location
              if [ -n "$(ls -A .)" ]; then
                OLD_FILES_DIR="/tmp/PondCDRSuite_old_files_$(date +%s)"
                echo "  ⚠️  Directory is not empty. Moving existing files to $OLD_FILES_DIR"
                mkdir -p "$OLD_FILES_DIR"
                mv * .[!.]* "$OLD_FILES_DIR"/ 2>/dev/null || true
              fi

              # Clone the repository into the current directory
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" . || {
                echo "ERROR: git clone failed"
                exit 1
              }
              echo "  ✓ Repository cloned"
            else
              # Repository already exists — update it
              # NOTE: no git stash here. Credential configs are protected by the
              # backup/restore above; git reset --hard does not touch
              # git-ignored files, so nothing else needs preserving.
              echo "  → Fetching origin..."
              git fetch origin 2>&1 || {
                echo "ERROR: git fetch failed"
                exit 1
              }

              echo "  → Resetting to origin/main..."
              git reset --hard origin/main 2>&1 || {
                echo "ERROR: git reset failed"
                exit 1
              }

              echo "  ✓ Repository updated"
            fi

            # Show current commit
            echo ""
            echo "  Current commit:"
            git log -1 --oneline

            # Ensure scripts are executable
            echo ""
            echo "=========================================="
            echo "🔧 Permissions"
            echo "=========================================="

            if [ -f "cdr_sync/cdr_sync.sh" ]; then
              chmod +x cdr_sync/cdr_sync.sh && echo "  ✓ cdr_sync.sh is executable" || echo "  ⚠️  chmod failed for cdr_sync.sh (check ownership)"
            else
              echo "  ⚠️  cdr_sync/cdr_sync.sh not found"
            fi

            if [ -f "cdr_sync/send_alert.py" ]; then
              chmod +x cdr_sync/send_alert.py && echo "  ✓ send_alert.py is executable" || echo "  ⚠️  chmod failed for send_alert.py (check ownership)"
            else
              echo "  ⚠️  cdr_sync/send_alert.py not found"
            fi

            # Generate logrotate configs for cdr_copy and cdr_sync
            echo ""
            echo "=========================================="
            echo "🔄 Configuring logrotate"
            echo "=========================================="

            if [ -f "logrotate.template" ]; then
              for project in cdr_copy cdr_sync; do
                LOG_DIR="$DEPLOY_DIR/$project/logs"
                TARGET_CONF="/etc/logrotate.d/$project"

                mkdir -p "$LOG_DIR" || true

                sed -e "s|__LOG_DIR__|$LOG_DIR|g" \
                    -e "s|__DEPLOY_USER__|$DEPLOY_USER|g" \
                  "logrotate.template" \
                  | sudo tee "$TARGET_CONF" > /dev/null

                echo "  ✓ $TARGET_CONF configured for $LOG_DIR (user: $DEPLOY_USER)"
                sudo logrotate -d "$TARGET_CONF" 2>&1 | head -3
              done
            else
              echo "  ⚠️  logrotate.template not found, skipping"
            fi

            # Check cron status
            echo ""
            echo "=========================================="
            echo "⏰ Cron Status"
            echo "=========================================="

            if systemctl is-active --quiet cron 2>/dev/null; then
              echo "  ✓ Cron service is running"
            else
              echo "  ⚠️  Cron service is not running"
            fi

            # Disk usage check
            echo ""
            echo "💾 Disk usage:"
            df -h /

            echo ""
            echo "=========================================="
            echo "✅ Deployment Successful!"
            echo "=========================================="
            echo "Version: $VERSION"
            echo ""
